app-id: io.github.wusel1007.clamav-gui

runtime: org.kde.Platform
runtime-version: "6.10"

sdk: org.kde.Sdk

command: clamav-gui

finish-args:
  - "--share=ipc"
  - "--socket=fallback-x11"
  - "--socket=wayland"
  - "--socket=session-bus"
  - "--talk-name=org.kde.StatusNotifierWatcher"
  - "--share=network"
  - "--filesystem=host:rw"
  - "--device=dri"
  - "--talk-name=org.freedesktop.Flatpak"
  - "--talk-name=org.freedesktop.Notifications"

modules:
  - name: clamav-gui
    buildsystem: cmake-ninja

    sources:
      - type: git
        url: https://github.com/wusel1007/clamav-gui
        branch: main

