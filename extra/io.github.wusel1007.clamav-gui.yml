app-id: io.github.wusel1007.clamav-gui

runtime: org.kde.Platform
runtime-version: "6.11"

sdk: org.kde.Sdk

command: clamav-gui

finish-args:
  - "--share=ipc"
  - "--socket=fallback-x11"
  - "--socket=wayland"
  - "--talk-name=org.kde.StatusNotifierWatcher"
  - "--talk-name=org.freedesktop.Notifications"
  - "--talk-name=org.freedesktop.Flatpak"
  - "--share=network"
  - "--filesystem=host:ro"
  - "--filesystem=home:rw"
  - "--device=dri"

modules:
  - name: clamav-gui
    buildsystem: cmake-ninja

    sources:
      - type: git
        url: https://github.com/wusel1007/clamav-gui.git
        tag: v.1.4.5
        commit: 217502030221ec93c528559afad616ec9d0d2ae4
